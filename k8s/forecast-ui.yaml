# AgriForecast Farmer App — Kubernetes deployment (local single-node cluster).
#
# DEPENDENCY: the `agriforecast` namespace is created by the BACKEND repo's
# kubernetes manifests (Agri_Forecast), together with the forecast-api
# Deployment/Service. Apply the backend manifests first, or this apply fails
# with `namespaces "agriforecast" not found`. This repo deliberately does NOT
# own the namespace object — two repos creating it would race on ownership.
#
# The image is built locally and never pushed to a registry, hence
# imagePullPolicy: IfNotPresent (with `latest`, the default `Always` would send
# the kubelet to Docker Hub and fail with ErrImagePull).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecast-ui
  namespace: agriforecast
  labels:
    app.kubernetes.io/name: forecast-ui
    app.kubernetes.io/part-of: agriforecast
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forecast-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forecast-ui
        app.kubernetes.io/part-of: agriforecast
    spec:
      containers:
        - name: forecast-ui
          # Built by: docker build --build-arg VITE_API_BASE_URL=http://localhost:30082 \
          #                        -t agriforecast-ui:latest .
          # NOTE: the API base URL is baked into the JS bundle at BUILD time —
          # it is a property of the image, not an env var on this pod.
          image: agriforecast-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # nginx serving static files: it is ready the moment it can answer.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          # A static-file nginx is tiny; these keep it from crowding the ML pods
          # on a laptop-sized cluster.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: forecast-ui
  namespace: agriforecast
  labels:
    app.kubernetes.io/name: forecast-ui
    app.kubernetes.io/part-of: agriforecast
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: forecast-ui
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
