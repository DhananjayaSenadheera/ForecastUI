# AgriForecast Farmer App — nginx site config (mounted at
# /etc/nginx/conf.d/default.conf by the Dockerfile).
#
# Three jobs, in order of how badly they break the app if wrong:
#   1. SPA history fallback  — the app uses BrowserRouter, so /my-harvest is a
#      client-side route with no file on disk. Without try_files it 404s on
#      refresh or on a shared link.
#   2. Honest caching        — hashed assets are immutable and cached for a
#      year; index.html and sw.js MUST revalidate every time or a farmer stays
#      pinned to an old bundle (and an old service worker) forever.
#   3. gzip                  — rural bandwidth. Text assets only.
#
# NOT here on purpose: any /api proxy. The bundle talks to the .NET API
# directly on its own base URL (single-base-URL model, baked at build time);
# CORS is handled backend-side. See k8s/README.md.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # --- compression (rural bandwidth) -----------------------------------
    # woff2 / png / svgz are ALREADY compressed — re-gzipping burns CPU for
    # nothing, so they are deliberately absent from gzip_types.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      application/javascript
                      application/json
                      application/manifest+json
                      image/svg+xml;

    # Don't leak the nginx version in Server: / error pages.
    server_tokens off;

    # NOTE on the repetition below: nginx `add_header` does NOT inherit into a
    # location that declares its own add_header. Every block therefore repeats
    # the security headers. Verbose beats silently unprotected.
    #
    # NOTE on `always`: it makes a header apply to ERROR responses too. That is
    # what we want for the security headers (a 404 body should still be
    # nosniff/DENY), and actively DANGEROUS for a long-lived Cache-Control.
    # During a rolling restart a browser can load the NEW index.html, request a
    # new hashed asset, be routed to the OLD pod, and get a 404 — stamped
    # `immutable` for a year, a reload would never heal it. So the long-cache
    # Cache-Control headers below deliberately omit `always`: a 200 gets the
    # long cache, a 404 gets no Cache-Control at all and stays retryable.

    # --- hashed build output: immutable, cache hard -----------------------
    # Vite writes /assets/<name>-<hash>.js|css. The hash changes on every
    # content change, so these can never go stale.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- static public/ assets: unhashed, so cache for a month only -------
    # Self-hosted Sinhala/Tamil/Latin font subsets and PWA icons. Filenames are
    # stable, so a replacement needs a rename (or up to 30 days to propagate).
    location ~* ^/(fonts|icons)/ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- service worker: NEVER cache --------------------------------------
    # sw.js carries the build-time-injected precache manifest. A cached sw.js
    # means the phone keeps serving the PREVIOUS bundle's shell after a deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- PWA manifest: revalidate (points at the icon set) ----------------
    location = /manifest.webmanifest {
        # Some nginx builds don't map .webmanifest; be explicit.
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- app shell: revalidate every load ---------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- everything else: SPA history fallback ----------------------------
    # /my-harvest, /best-crops, /admin/... are client-side routes. The final
    # argument is a URI, so nginx internally redirects to /index.html and the
    # `location = /index.html` block above re-applies the no-cache headers.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
